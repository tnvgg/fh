[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flakehunt"
version = "0.2.0"
description = "Find flaky pytest tests, shrink them to a minimal reproducer, and get a verified fix from the BharatCode model API."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["pytest>=7", "typer>=0.9", "rich>=13", "fastapi>=0.100", "uvicorn>=0.23", "requests>=2.28", "python-dotenv>=1.0"]

[project.scripts]
flakehunt = "flakehunt.main:app"

[tool.hatch.build.targets.wheel]
packages = ["flakehunt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
